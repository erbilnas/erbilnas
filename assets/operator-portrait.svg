<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Operator Erbil portrait">
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#160B24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0A0612" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="50%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#FFE566"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1840"/>
      <stop offset="100%" stop-color="#0A0612"/>
    </linearGradient>
  </defs>
  <rect width="220" height="220" rx="18" fill="#0A0612"/>
  <circle cx="110" cy="110" r="96" fill="url(#halo)"/>
  <circle cx="110" cy="110" r="92" fill="none" stroke="#2A1840" stroke-width="2"/>
  <circle cx="110" cy="110" r="92" fill="none" stroke="#BF5AF2" stroke-width="1" stroke-dasharray="4 6" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 110 110" to="360 110 110" dur="28s" repeatCount="indefinite"/>
  </circle>
  <!-- shoulders / jacket -->
  <path d="M40 200 C55 150 75 130 110 130 C145 130 165 150 180 200 Z" fill="url(#jacket)" stroke="#BF5AF2" stroke-width="1.2"/>
  <path d="M96 132 L110 168 L124 132" fill="none" stroke="#FFE566" stroke-width="1.4" opacity="0.85"/>
  <!-- head -->
  <ellipse cx="110" cy="88" rx="34" ry="38" fill="#1A1028" stroke="#BF5AF2" stroke-width="1.5"/>
  <!-- short hair -->
  <path d="M78 78 C82 52 138 52 142 78 C130 62 90 62 78 78 Z" fill="#0A0612" stroke="#3A1A5C" stroke-width="1"/>
  <!-- beard suggestion -->
  <path d="M88 108 Q110 128 132 108" fill="none" stroke="#3A1A5C" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- sunglasses (from lore) -->
  <rect x="82" y="84" width="22" height="12" rx="2" fill="#0A0612" stroke="url(#visor)" stroke-width="1.6"/>
  <rect x="116" y="84" width="22" height="12" rx="2" fill="#0A0612" stroke="url(#visor)" stroke-width="1.6"/>
  <line x1="104" y1="90" x2="116" y2="90" stroke="#FFE566" stroke-width="1.5"/>
  <rect x="84" y="86" width="18" height="4" rx="1" fill="#FFE566" opacity="0.25"/>
  <rect x="118" y="86" width="18" height="4" rx="1" fill="#BF5AF2" opacity="0.3"/>
  <!-- ear nodes -->
  <circle cx="74" cy="90" r="3" fill="#FFE566">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="146" cy="90" r="3" fill="#BF5AF2">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="110" y="198" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#BF5AF2">OPERATOR · ERBIL</text>
</svg>
