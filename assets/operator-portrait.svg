<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260" role="img" aria-label="Operator Erbil portrait">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#160B24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A0612" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1A3A"/>
      <stop offset="100%" stop-color="#140C1E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE566" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#BF5AF2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE566" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241436"/>
      <stop offset="100%" stop-color="#0A0612"/>
    </linearGradient>
    <pattern id="scan" width="240" height="4" patternUnits="userSpaceOnUse">
      <rect width="240" height="1" fill="#BF5AF2" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="240" height="260" rx="16" fill="#0A0612"/>
  <rect width="240" height="260" rx="16" fill="url(#bgGlow)"/>
  <rect width="240" height="260" rx="16" fill="url(#scan)"/>
  <rect x="1" y="1" width="238" height="258" rx="15" fill="none" stroke="#2A1840" stroke-width="1.5"/>
  <!-- corner marks -->
  <path d="M14 28 H28 M14 28 V42" stroke="#FFE566" stroke-width="1.3" fill="none"/>
  <path d="M212 28 H226 M226 28 V42" stroke="#FFE566" stroke-width="1.3" fill="none"/>
  <path d="M14 218 H28 M14 218 V232" stroke="#BF5AF2" stroke-width="1.3" fill="none"/>
  <path d="M212 218 H226 M226 218 V232" stroke="#BF5AF2" stroke-width="1.3" fill="none"/>
  <!-- coat / shoulders -->
  <path d="M28 248 C48 170 78 148 120 148 C162 148 192 170 212 248 Z" fill="url(#coat)" stroke="#BF5AF2" stroke-width="1.2"/>
  <path d="M104 150 L120 188 L136 150" fill="none" stroke="#FFE566" stroke-width="1.3" opacity="0.9"/>
  <!-- neck -->
  <rect x="108" y="128" width="24" height="24" rx="6" fill="#1A1028"/>
  <!-- head -->
  <ellipse cx="120" cy="96" rx="38" ry="44" fill="url(#skinShade)" stroke="#BF5AF2" stroke-width="1.4"/>
  <!-- short hair mass -->
  <path d="M84 88 C88 52 152 52 156 88 C148 64 92 64 84 88 Z" fill="#0A0612"/>
  <path d="M86 78 C100 58 140 58 154 78" fill="none" stroke="#3A1A5C" stroke-width="2"/>
  <!-- beard -->
  <path d="M96 118 Q120 142 144 118" fill="none" stroke="#2A1840" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <path d="M100 116 Q120 136 140 116" fill="none" stroke="#160B24" stroke-width="2"/>
  <!-- sunglasses planes -->
  <path d="M86 92 L112 88 L112 104 L86 108 Z" fill="#0A0612" stroke="url(#glass)" stroke-width="1.8"/>
  <path d="M128 88 L154 92 L154 108 L128 104 Z" fill="#0A0612" stroke="url(#glass)" stroke-width="1.8"/>
  <rect x="112" y="94" width="16" height="3" rx="1" fill="#FFE566"/>
  <path d="M90 94 L108 91" stroke="#FFE566" stroke-width="1" opacity="0.45"/>
  <path d="M132 91 L150 94" stroke="#BF5AF2" stroke-width="1" opacity="0.4"/>
  <!-- ear nodes -->
  <rect x="78" y="94" width="6" height="10" rx="1" fill="#160B24" stroke="#FFE566" stroke-width="1"/>
  <rect x="156" y="94" width="6" height="10" rx="1" fill="#160B24" stroke="#BF5AF2" stroke-width="1"/>
  <circle cx="81" cy="99" r="1.5" fill="#FFE566">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="159" cy="99" r="1.5" fill="#BF5AF2">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="250" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#BF5AF2">OPERATOR · ERBIL</text>
</svg>
