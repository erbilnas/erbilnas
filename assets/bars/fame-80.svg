<svg xmlns="http://www.w3.org/2000/svg" width="260" height="24" role="img" aria-label="80%">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B2FC9"/>
      <stop offset="70%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#FFE566"/>
    </linearGradient>
    <filter id="tipGlow" x="-50%" y="-80%" width="200%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="260" height="24" rx="5" fill="#0A0612" stroke="#2A1840" stroke-width="1"/>
  <rect x="3" y="3" width="254" height="18" rx="3.5" fill="#160B24" stroke="#3A1A5C" stroke-width="0.75"/>
  <rect x="3" y="3" width="0" height="18" rx="3.5" fill="url(#fill)">
    <animate attributeName="width" from="0" to="203.2" begin="0.0s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <rect x="200.2" y="5" width="5" height="14" rx="1.5" fill="#FFE566" opacity="0" filter="url(#tipGlow)">
    <animate attributeName="opacity" from="0" to="0.95" begin="0.85s" dur="0.25s" fill="freeze"/>
  </rect>
  <text x="130.0" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FFE566">80%</text>
</svg>
