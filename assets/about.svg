<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="t d">
<title id="t">Neural log</title>
<desc id="d">Introducing myself is always awkward, so here&#x27;s the short version. I&#x27;m a software engineer. I like learning, and I build things with zeros and ones. I&#x27;m 29, born and raised in Turkey. Average height, a bit leaner than most. Short hair, beard. On sunny days I wear sunglasses because of an eye issue. Sunlight and I are not friends. I&#x27;ve been into computers, software, and video games since I was a kid. That trail led me into software engineering. I&#x27;m not the most social person, but if you catch me on something I care about, I talk a lot. ^_^ People have called me intelligent, sophisticated, cultured, dignified, gentle, calm, and humble. Nice words. I care more about doing what&#x27;s right than about sounding like a good person. Thanks for reading. Take care and stay safe.</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
