<g class="ln" style="animation-delay:.15s"><text x="52" y="96" class="dim"><tspan class="gr">$</tspan> cat ~/about.md <tspan fill="#484f58"># personal lore</tspan></text></g>
<g class="ln" style="animation-delay:0.25s"><text x="52" y="126" class="fg" style="font-size:13px">› Introducing myself is always awkward, so here&#x27;s the short version. I&#x27;m a</text></g>
<g class="ln" style="animation-delay:0.31s"><text x="52" y="146" class="fg" style="font-size:13px">  software engineer. I like learning, and I build things with zeros and ones.</text></g>
<g class="ln" style="animation-delay:0.37s"><text x="52" y="166" class="fg" style="font-size:13px">  I&#x27;m 29, born and raised in Turkey.</text></g>
<g class="ln" style="animation-delay:0.43s"><text x="52" y="198" class="fg" style="font-size:13px">› Average height, a bit leaner than most. Short hair, beard. On sunny days I</text></g>
<g class="ln" style="animation-delay:0.49s"><text x="52" y="218" class="fg" style="font-size:13px">  wear sunglasses because of an eye issue. Sunlight and I are not friends.</text></g>
<g class="ln" style="animation-delay:0.55s"><text x="52" y="250" class="fg" style="font-size:13px">› I&#x27;ve been into computers, software, and video games since I was a kid. That</text></g>
<g class="ln" style="animation-delay:0.61s"><text x="52" y="270" class="fg" style="font-size:13px">  trail led me into software engineering. I&#x27;m not the most social person, but if</text></g>
<g class="ln" style="animation-delay:0.67s"><text x="52" y="290" class="fg" style="font-size:13px">  you catch me on something I care about, I talk a lot. ^_^</text></g>
<g class="ln" style="animation-delay:0.73s"><text x="52" y="322" class="fg" style="font-size:13px">› People have called me intelligent, sophisticated, cultured, dignified, gentle,</text></g>
<g class="ln" style="animation-delay:0.79s"><text x="52" y="342" class="fg" style="font-size:13px">  calm, and humble. Nice words. I care more about doing what&#x27;s right than about</text></g>
<g class="ln" style="animation-delay:0.85s"><text x="52" y="362" class="fg" style="font-size:13px">  sounding like a good person.</text></g>
<g class="ln" style="animation-delay:0.91s"><text x="52" y="394" class="fg" style="font-size:13px">› Thanks for reading. Take care and stay safe.</text></g>
